<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Peppa – músarleikur</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(#52c6f5,#c9efff);color:#164c70;display:flex;justify-content:center;align-items:center;padding:16px}.app{width:min(1220px,100%);background:#fff;border-radius:26px;box-shadow:0 18px 55px #17547a33;overflow:hidden}.screen{display:none}.screen.on{display:block}.home{padding:26px}.hero{display:flex;align-items:center;justify-content:space-between;gap:20px}.hero h1{font-size:clamp(2.2rem,5vw,4.1rem);margin:0;color:#1767a3;line-height:1}.hero p{font-size:clamp(1rem,2vw,1.3rem);font-weight:700;color:#557d93}.pigLogo{width:160px;height:160px;flex:0 0 auto}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:22px}.lvl{min-height:120px;border:0;border-radius:20px;background:linear-gradient(#fff,#edf9ff);box-shadow:0 5px 0 #c9e6f3;color:#145b8f;cursor:pointer;font-weight:800;position:relative;padding:14px}.lvl:hover:not(.locked){transform:translateY(-2px)}.lvl.locked{opacity:.5;filter:grayscale(.6);cursor:not-allowed}.n{display:block;font-size:2rem;font-weight:900}.dots{display:flex;justify-content:center;gap:5px;margin-top:10px}.dot{width:14px;height:14px;border-radius:50%;background:#d7e4e9;border:2px solid #b6cad4}.dot.done{background:#ffd43a;border-color:#e9aa00}.lock{position:absolute;right:10px;top:8px;font-size:1.3rem}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px;font-weight:700;color:#678493}.btn{border:0;border-radius:14px;padding:11px 15px;background:#eaf6fc;color:#265f80;font-weight:800;cursor:pointer}.top{display:flex;align-items:center;gap:10px;padding:12px 14px}.top strong{margin-right:auto;font-size:1.2rem}.pill{background:#edf8fd;border-radius:999px;padding:8px 12px;font-weight:900}.icon{border:0;background:#eaf7fd;border-radius:12px;min-width:44px;height:40px;font-size:1.2rem;cursor:pointer}.stage{position:relative;background:#48be48;user-select:none;touch-action:none}.stage canvas{width:100%;height:auto;display:block;touch-action:none}.msg{position:absolute;left:50%;top:14px;transform:translateX(-50%) scale(.96);opacity:0;background:#fffffff4;border-radius:16px;padding:12px 20px;font-size:1.2rem;font-weight:900;box-shadow:0 8px 22px #0002;transition:.15s;pointer-events:none;text-align:center}.msg.show{opacity:1;transform:translateX(-50%) scale(1)}.msg.good{color:#16843b}.msg.bad{color:#b74242}.help{text-align:center;padding:11px 14px 14px;font-weight:800;color:#55778a}.modalBg{position:fixed;inset:0;background:#093c5c77;display:none;align-items:center;justify-content:center;padding:20px;z-index:9}.modalBg.show{display:flex}.modal{background:white;border-radius:26px;padding:28px;text-align:center;width:min(500px,100%);box-shadow:0 20px 60px #0004}.modal .big{font-size:4rem}.modal h2{font-size:2rem;color:#176499;margin:8px}.modal p{font-size:1.1rem;font-weight:700;color:#5c788a}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.primary{background:#25a953;color:white;border:0;border-radius:15px;padding:13px 20px;font-weight:900;font-size:1.05rem;cursor:pointer}.secondary{background:#eaf5fb;color:#245f80;border:0;border-radius:15px;padding:13px 20px;font-weight:900;cursor:pointer}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.pigLogo{width:110px;height:110px}.home{padding:18px}.top strong{font-size:1rem}.pill{font-size:.9rem}}@media(max-width:520px){body{padding:0}.app{border-radius:0;min-height:100vh}.pigLogo{display:none}.grid{gap:9px}.lvl{min-height:100px}.n{font-size:1.6rem}.msg{max-width:90%;white-space:normal}}
</style>
</head>
<body>
<div class="app">
<section id="home" class="screen on home">
<div class="hero"><div><h1>Hjálpaðu Peppu heim!</h1><p>Smelltu á Peppu, haltu músarhnappnum inni og dragðu hana alla leið heim.</p></div><canvas id="logo" class="pigLogo" width="180" height="180"></canvas></div>
<div id="grid" class="grid"></div>
<div class="footer"><span>⭐ Kláraðu hvert stig 5 sinnum til að opna næsta stig.</span><div><button id="sound1" class="btn">🔊 Hljóð</button> <button id="reset" class="btn">↺ Endurstilla</button></div></div>
</section>
<section id="game" class="screen">
<div class="top"><button id="back" class="icon">←</button><strong id="title">Stig 1</strong><span id="count" class="pill">⭐ 0 / 5</span><button id="sound2" class="icon">🔊</button><button id="full" class="icon">⛶</button></div>
<div class="stage"><canvas id="c" width="1200" height="650"></canvas><div id="msg" class="msg"></div></div>
<div class="help">🖱️ Smelltu á Peppu og haltu hnappnum inni á meðan þú dregur hana heim.</div>
</section>
</div>
<div id="modalBg" class="modalBg"><div class="modal"><div id="mIcon" class="big">⭐</div><h2 id="mTitle">Vel gert!</h2><p id="mText"></p><div class="actions"><button id="next" class="primary">Næsta stig</button><button id="menu" class="secondary">Stigaval</button></div></div></div>
<script>
(()=>{'use strict';
const levels=[
['Frjáls leið',0,[[145,330],[1015,330]]],
['Beina leiðin',270,[[145,330],[1015,330]]],
['Ein beygja',255,[[145,180],[710,180],[710,470],[1015,470]]],
['Tvær beygjur',245,[[145,500],[410,500],[410,185],[1015,185]]],
['Sikk-sakk',230,[[145,155],[420,155],[420,485],[760,485],[760,220],[1015,220]]],
['Lengri leið',220,[[145,515],[340,515],[340,155],[610,155],[610,490],[875,490],[875,225],[1015,225]]],
['Þröngar beygjur',210,[[145,135],[350,135],[350,510],[570,510],[570,230],[800,230],[800,500],[1015,500]]],
['Snákaleiðin',200,[[145,520],[305,520],[305,145],[525,145],[525,500],[735,500],[735,180],[1015,180]]],
['Músameistarinn',190,[[145,145],[310,145],[310,500],[490,500],[490,205],[670,205],[670,500],[850,500],[850,160],[1015,160]]],
['Lokaleiðin',180,[[145,520],[285,520],[285,150],[455,150],[455,470],[615,470],[615,190],[775,190],[775,510],[925,510],[925,250],[1015,250]]]
];
const $=id=>document.getElementById(id),home=$('home'),game=$('game'),grid=$('grid'),c=$('c'),x=c.getContext('2d'),msg=$('msg'),modal=$('modalBg');
const KEY='peppaMouseGameProgressV2',SK='peppaMouseGameSoundV2';let p=load(),sound=localStorage.getItem(SK)!=='off',L=0,drag=false,busy=false,timer,audio;let pig={x:0,y:0,w:118,h:150};
function load(){try{let a=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(a)&&a.length===10)return a.map(v=>Math.max(0,Math.min(5,+v||0)))}catch(e){}return Array(10).fill(0)}function save(){localStorage.setItem(KEY,JSON.stringify(p))}function open(i){return i===0||p[i-1]>=5}
function menu(){grid.innerHTML='';levels.forEach((l,i)=>{let b=document.createElement('button');b.className='lvl'+(open(i)?'':' locked');b.innerHTML=`<span class="n">Stig ${i+1}</span>${l[0]}<div class="dots">${[0,1,2,3,4].map(n=>`<span class="dot ${n<p[i]?'done':''}"></span>`).join('')}</div>${open(i)?'':'<span class="lock">🔒</span>'}`;b.onclick=()=>open(i)?start(i):toast('Kláraðu stigið á undan 5 sinnum ⭐','bad');grid.appendChild(b)});syncSound();drawLogo()}
function start(i){L=i;home.classList.remove('on');game.classList.add('on');$('title').textContent=`Stig ${i+1} – ${levels[i][0]}`;count();resetPig();busy=false}
function back(){drag=false;busy=false;game.classList.remove('on');home.classList.add('on');menu()}function count(){$('count').textContent=`⭐ ${p[L]} / 5`}
function resetPig(){let s=levels[L][2][0];pig.x=s[0]-pig.w/2;pig.y=s[1]-pig.h/2;drag=false;draw()}
function draw(){let l=levels[L];x.clearRect(0,0,1200,650);let g=x.createLinearGradient(0,0,0,650);g.addColorStop(0,'#4dc2f2');g.addColorStop(.46,'#a3e5fb');g.addColorStop(.461,'#55ca4f');g.addColorStop(1,'#39ad41');x.fillStyle=g;x.fillRect(0,0,1200,650);cloud(150,90,1);cloud(850,95,.75);sun(1080,85);x.fillStyle='#26994388';x.beginPath();x.moveTo(0,360);x.quadraticCurveTo(230,250,480,350);x.quadraticCurveTo(760,230,1200,345);x.lineTo(1200,650);x.lineTo(0,650);x.fill();if(l[1])path(l);flowers();let s=l[2][0],e=l[2].at(-1);x.fillStyle='#ffffffcc';x.beginPath();x.arc(s[0],s[1],72,0,7);x.fill();x.fillStyle='#276b8b';x.font='900 22px Arial';x.textAlign='center';x.fillText('BYRJA',s[0],Math.min(630,s[1]+105));x.fillStyle='#ffeb3840';x.beginPath();x.arc(e[0],e[1],108,0,7);x.fill();house(e[0],e[1]);x.fillStyle='white';x.strokeStyle='#24698c';x.lineWidth=5;x.strokeText('HEIM',e[0],Math.min(630,e[1]+115));x.fillText('HEIM',e[0],Math.min(630,e[1]+115));drawPig(pig.x,pig.y,pig.w,pig.h)}
function path(l){let a=l[2],w=l[1];x.lineCap='round';x.lineJoin='round';stroke(a,w+42,'#16763c');stroke(a,w+26,'#2e9c45');stroke(a,w,'#f1d38b');stroke(a,w-22,'#ffe9aeaa')}function stroke(a,w,col){x.beginPath();x.moveTo(...a[0]);for(let i=1;i<a.length;i++)x.lineTo(...a[i]);x.strokeStyle=col;x.lineWidth=w;x.stroke()}
function cloud(a,b,s){x.save();x.translate(a,b);x.scale(s,s);x.fillStyle='#fff';[[0,0,30],[34,-10,40],[74,5,29],[37,16,43]].forEach(q=>{x.beginPath();x.arc(...q,0,7);x.fill()});x.restore()}function sun(a,b){x.save();x.translate(a,b);x.strokeStyle='#ffe426';x.lineWidth=7;for(let i=0;i<8;i++){let q=i*Math.PI/4;x.beginPath();x.moveTo(Math.cos(q)*50,Math.sin(q)*50);x.lineTo(Math.cos(q)*68,Math.sin(q)*68);x.stroke()}x.fillStyle='#ffe72c';x.beginPath();x.arc(0,0,36,0,7);x.fill();x.restore()}
function flowers(){[[235,560],[1020,550],[930,300],[530,565],[1110,410],[730,112]].forEach((q,i)=>{x.save();x.translate(...q);x.fillStyle=i%2?'#fff':'#ffe34b';for(let n=0;n<5;n++){x.rotate(1.256);x.beginPath();x.ellipse(0,9,6,11,0,0,7);x.fill()}x.fillStyle='#f2a31a';x.beginPath();x.arc(0,0,5,0,7);x.fill();x.restore()})}
function house(cx,cy){x.save();x.translate(cx-68,cy-78);x.fillStyle='#f9ee58';x.fillRect(17,42,102,104);x.fillStyle='#ef633b';x.beginPath();x.moveTo(10,45);x.lineTo(58,5);x.lineTo(126,45);x.closePath();x.fill();x.fillStyle='#f7ed58';x.beginPath();x.moveTo(17,42);x.lineTo(58,8);x.lineTo(93,42);x.fill();x.fillStyle='#50bcea';for(let r=0;r<2;r++)for(let c=0;c<2;c++){let px=30+c*39,py=62+r*42;x.fillRect(px,py,24,27);x.strokeStyle='white';x.lineWidth=4;x.strokeRect(px,py,24,27);x.beginPath();x.moveTo(px+12,py);x.lineTo(px+12,py+27);x.moveTo(px,py+13);x.lineTo(px+24,py+13);x.stroke()}x.fillStyle='#ffd51f';x.fillRect(93,104,18,42);x.strokeStyle='#d09f00';x.lineWidth=2;x.strokeRect(93,104,18,42);x.restore()}
function drawPig(px,py,w,h){x.save();x.translate(px,py);let sx=w/118,sy=h/150;x.scale(sx,sy);x.fillStyle='#0003';x.beginPath();x.ellipse(58,143,35,8,0,0,7);x.fill();x.strokeStyle='#ec83ba';x.lineWidth=8;x.lineCap='round';x.beginPath();x.moveTo(36,112);x.lineTo(18,126);x.moveTo(80,112);x.lineTo(101,125);x.moveTo(46,133);x.lineTo(44,145);x.moveTo(72,133);x.lineTo(73,145);x.stroke();x.fillStyle='#ec4f59';x.beginPath();x.moveTo(36,84);x.lineTo(83,84);x.lineTo(91,132);x.lineTo(28,132);x.closePath();x.fill();x.fillStyle='#f79dcc';x.strokeStyle='#e57db6';x.lineWidth=4;x.beginPath();x.ellipse(57,59,42,39,0,0,7);x.fill();x.stroke();x.beginPath();x.ellipse(43,17,9,19,-.25,0,7);x.ellipse(65,14,9,20,.12,0,7);x.fill();x.stroke();x.beginPath();x.ellipse(92,55,28,19,0,0,7);x.fill();x.stroke();x.fillStyle='#d778a7';x.beginPath();x.arc(99,50,3.5,0,7);x.arc(106,57,3.5,0,7);x.fill();x.fillStyle='white';x.beginPath();x.arc(48,45,8,0,7);x.arc(67,42,8,0,7);x.fill();x.fillStyle='black';x.beginPath();x.arc(51,46,3.5,0,7);x.arc(70,43,3.5,0,7);x.fill();x.fillStyle='#f277b9';x.beginPath();x.arc(34,68,8,0,7);x.fill();x.strokeStyle='#cf3e86';x.lineWidth=3;x.beginPath();x.arc(66,65,17,.2,2.4);x.stroke();x.restore()}
function drawLogo(){let q=$('logo').getContext('2d');q.clearRect(0,0,180,180);let old=x;x=q;drawPig(30,12,120,152);x=old}
function dist(px,py,a,b){let vx=b[0]-a[0],vy=b[1]-a[1],wx=px-a[0],wy=py-a[1],c=vx*wx+vy*wy;if(c<=0)return Math.hypot(px-a[0],py-a[1]);let d=vx*vx+vy*vy;if(c>=d)return Math.hypot(px-b[0],py-b[1]);let t=c/d;return Math.hypot(px-a[0]-t*vx,py-a[1]-t*vy)}function allowed(px,py){let l=levels[L];if(!l[1])return px>55&&px<1145&&py>100&&py<595;let m=Infinity,a=l[2];for(let i=0;i<a.length-1;i++)m=Math.min(m,dist(px,py,a[i],a[i+1]));return m<=l[1]/2-43}
function pt(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*1200/r.width,y:(e.clientY-r.top)*650/r.height}}function hit(q){return q.x>=pig.x-12&&q.x<=pig.x+pig.w+12&&q.y>=pig.y-12&&q.y<=pig.y+pig.h+12}
c.onpointerdown=e=>{if(busy)return;let q=pt(e);if(!hit(q)){toast('Smelltu á Peppu 🐷','bad',900);return}drag=true;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag||busy)return;let q=pt(e),nx=q.x-pig.w/2,ny=q.y-pig.h/2,ox=pig.x+pig.w/2,oy=pig.y+pig.h/2,ncx=nx+pig.w/2,ncy=ny+pig.h/2,steps=Math.max(1,Math.ceil(Math.hypot(ncx-ox,ncy-oy)/8));for(let i=1;i<=steps;i++){let t=i/steps;if(!allowed(ox+(ncx-ox)*t,oy+(ncy-oy)*t)){fail('Ó nei! Peppa snerti vegginn 🌿');return}}pig.x=nx;pig.y=ny;draw();if(goal())success()};c.onpointerup=()=>{if(!drag||busy)return;drag=false;goal()?success():fail('Haltu músarhnappnum inni alla leið 🖱️')};c.onpointercancel=()=>drag&&fail('Reyndu aftur 🙂');
function goal(){let e=levels[L][2].at(-1);return Math.hypot(pig.x+pig.w/2-e[0],pig.y+pig.h/2-e[1])<64}function fail(t){if(busy)return;drag=false;busy=true;tone(false);toast(t,'bad',850);setTimeout(()=>{resetPig();busy=false},650)}function success(){if(busy)return;drag=false;busy=true;tone(true);if(p[L]<5)p[L]++;save();count();draw();if(p[L]>=5)setTimeout(done,400);else{toast(`Frábært! ${p[L]} af 5 ⭐`,'good',1050);setTimeout(()=>{resetPig();busy=false},900)}}
function done(){$('mIcon').textContent=L===9?'🏆':'⭐';$('mTitle').textContent=L===9?'Þú kláraðir allan leikinn!':`Stig ${L+1} klárað!`;$('mText').textContent=L===9?'Frábær músastjórn! Þú getur æft hvaða stig sem er aftur.':`Þú komst með Peppu heim 5 sinnum. Stig ${L+2} er nú opið.`;$('next').textContent=L===9?'Spila aftur':`Fara í stig ${L+2}`;modal.classList.add('show')}
function toast(t,k='good',ms=1200){clearTimeout(timer);msg.textContent=t;msg.className=`msg ${k} show`;timer=setTimeout(()=>msg.classList.remove('show'),ms)}function syncSound(){$('sound1').textContent=sound?'🔊 Hljóð':'🔇 Hljóð';$('sound2').textContent=sound?'🔊':'🔇'}function toggle(){sound=!sound;localStorage.setItem(SK,sound?'on':'off');syncSound();if(sound)tone(true)}function tone(ok){if(!sound)return;try{audio||=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=ok?660:210;if(ok)o.frequency.exponentialRampToValueAtTime(980,audio.currentTime+.18);g.gain.setValueAtTime(.001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.12,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.25);o.start();o.stop(audio.currentTime+.28)}catch(e){}}
$('back').onclick=back;$('sound1').onclick=toggle;$('sound2').onclick=toggle;$('full').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch(e){}};$('reset').onclick=()=>{if(confirm('Viltu endurstilla allan árangur?')){p=Array(10).fill(0);save();menu()}};$('next').onclick=()=>{modal.classList.remove('show');if(L===9)start(9);else start(L+1)};$('menu').onclick=()=>{modal.classList.remove('show');back()};menu();syncSound();
})();
</script>
</body></html>
