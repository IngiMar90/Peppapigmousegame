<!doctype html><html lang=is><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Peppa – músarleikur</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(#52c4f4,#c9f0ff);color:#174d70;padding:14px}.app{max-width:1200px;margin:auto;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 12px 40px #0002}.s{display:none}.s.on{display:block}.home{padding:24px}h1{font-size:clamp(2rem,5vw,4rem);margin:0;color:#155da0}.hero{display:flex;justify-content:space-between;align-items:center;gap:15px}.hero img{width:150px;filter:drop-shadow(0 6px 6px #0002)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:20px}.lvl{border:0;border-radius:18px;background:#eefaff;min-height:115px;font-weight:800;color:#145b8f;box-shadow:0 5px #c7e5f3;cursor:pointer}.lvl.lock{opacity:.45;cursor:not-allowed}.n{display:block;font-size:1.8rem}.dots{display:flex;gap:4px;justify-content:center;margin-top:8px}.d{width:13px;height:13px;border-radius:50%;background:#d7e4ea}.d.y{background:#ffcf39}.foot,.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.foot{justify-content:space-between;margin-top:18px;font-weight:700}button{font:inherit}.b{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;background:#e9f5fb;color:#245f80}.top{padding:10px}.top strong{margin-right:auto}.pill{background:#edf8fd;border-radius:999px;padding:8px 12px;font-weight:900}canvas{width:100%;height:auto;display:block;background:#55c94f;touch-action:none}.msg{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#fffd;padding:10px 16px;border-radius:14px;font-weight:900;opacity:0;pointer-events:none}.msg.on{opacity:1}.wrap{position:relative}.help{text-align:center;padding:10px;font-weight:800}.modal{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center;padding:20px}.modal.on{display:flex}.box{background:#fff;border-radius:22px;padding:25px;text-align:center;max-width:450px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.hero img{width:100px}}@media(max-width:520px){body{padding:0}.app{border-radius:0}.hero img{display:none}}</style><body><div class=app><section id=home class="s on home"><div class=hero><div><h1>Hjálpaðu Peppu heim!</h1><p>Smelltu á Peppu, haltu músarhnappnum inni og dragðu hana alla leið heim.</p></div><img id=logo></div><div id=grid class=grid></div><div class=foot><span>⭐ Kláraðu hvert stig 5 sinnum til að opna næsta stig.</span><div><button id=s1 class=b>🔊 Hljóð</button> <button id=reset class=b>↺ Endurstilla</button></div></div></section><section id=game class=s><div class=top><button id=back class=b>←</button><strong id=title>Stig 1</strong><span id=count class=pill>⭐ 0 / 5</span><button id=s2 class=b>🔊</button><button id=full class=b>⛶</button></div><div class=wrap><canvas id=c width=1200 height=650></canvas><div id=msg class=msg></div></div><div class=help>🖱️ Smelltu á Peppu og haltu hnappnum inni á meðan þú dregur hana heim.</div></section></div><div id=modal class=modal><div class=box><div id=mi style="font-size:4rem">⭐</div><h2 id=mt>Vel gert!</h2><p id=mx></p><button id=next class=b>Næsta stig</button> <button id=menu class=b>Stigaval</button></div></div><script>(()=>{'use strict';const P='peppa.webp',H='house.webp',pi=new Image,hi=new Image;pi.src=P;hi.src=H;logo.src=P;const L=[['Frjáls leið',0,[[145,330],[1015,330]]],['Beina leiðin',270,[[145,330],[1015,330]]],['Ein beygja',255,[[145,180],[710,180],[710,470],[1015,470]]],['Tvær beygjur',245,[[145,500],[410,500],[410,185],[1015,185]]],['Sikk-sakk',230,[[145,155],[420,155],[420,485],[760,485],[760,220],[1015,220]]],['Lengri leið',220,[[145,515],[340,515],[340,155],[610,155],[610,490],[875,490],[875,225],[1015,225]]],['Þröngar beygjur',210,[[145,135],[350,135],[350,510],[570,510],[570,230],[800,230],[800,500],[1015,500]]],['Snákaleiðin',200,[[145,520],[305,520],[305,145],[525,145],[525,500],[735,500],[735,180],[1015,180]]],['Músameistarinn',190,[[145,145],[310,145],[310,500],[490,500],[490,205],[670,205],[670,500],[850,500],[850,160],[1015,160]]],['Lokaleiðin',180,[[145,520],[285,520],[285,150],[455,150],[455,470],[615,470],[615,190],[775,190],[775,510],[925,510],[925,250],[1015,250]]]];const $=i=>document.getElementById(i),x=c.getContext('2d'),K='peppaMouseGameProgressV2',S='peppaMouseGameSoundV2';let p=load(),snd=localStorage.getItem(S)!=='off',n=0,drag=0,busy=0,t,audio,pig={x:0,y:0,w:118,h:156};function load(){try{let a=JSON.parse(localStorage.getItem(K));if(Array.isArray(a)&&a.length==10)return a.map(v=>Math.max(0,Math.min(5,+v||0)))}catch(e){}return Array(10).fill(0)}function save(){localStorage.setItem(K,JSON.stringify(p))}function open(i){return !i||p[i-1]>=5}function render(){grid.innerHTML='';L.forEach((l,i)=>{let b=document.createElement('button');b.className='lvl'+(open(i)?'':' lock');b.innerHTML=`<span class=n>Stig ${i+1}</span>${l[0]}<div class=dots></div>`;let q=b.querySelector('.dots');for(let j=0;j<5;j++)q.innerHTML+=`<span class="d ${j<p[i]?'y':''}"></span>`;b.onclick=()=>open(i)?start(i):toast('Kláraðu stigið á undan 5 sinnum ⭐');grid.appendChild(b)});sync()}function start(i){n=i;home.classList.remove('on');game.classList.add('on');title.textContent=`Stig ${i+1} – ${L[i][0]}`;count.textContent=`⭐ ${p[i]} / 5`;resetPig();busy=0}function resetPig(){let a=L[n][2][0];pig.x=a[0]-pig.w/2;pig.y=a[1]-pig.h/2;drag=0;draw()}function path(a,w,col){x.beginPath();x.moveTo(...a[0]);for(let i=1;i<a.length;i++)x.lineTo(...a[i]);x.lineCap=x.lineJoin='round';x.strokeStyle=col;x.lineWidth=w;x.stroke()}function draw(){let l=L[n];x.clearRect(0,0,1200,650);let g=x.createLinearGradient(0,0,0,650);g.addColorStop(0,'#4bc1f2');g.addColorStop(.48,'#9ee4fb');g.addColorStop(.481,'#55ca4f');g.addColorStop(1,'#3eb643');x.fillStyle=g;x.fillRect(0,0,1200,650);x.fillStyle='#279b3f88';x.beginPath();x.moveTo(0,355);x.quadraticCurveTo(230,250,475,350);x.quadraticCurveTo(760,230,1200,340);x.lineTo(1200,650);x.lineTo(0,650);x.fill();if(l[1]){path(l[2],l[1]+42,'#187c3f');path(l[2],l[1]+26,'#2e9f45');path(l[2],l[1],'#f2d691')}let s=l[2][0],e=l[2].at(-1);x.fillStyle='#fff';x.globalAlpha=.8;x.beginPath();x.arc(s[0],s[1],72,0,7);x.fill();x.globalAlpha=1;x.fillStyle='#25678b';x.font='900 22px Arial';x.textAlign='center';x.fillText('BYRJA',s[0],Math.min(630,s[1]+105));if(hi.complete)x.drawImage(hi,e[0]-75,e[1]-93,150,171);x.fillStyle='#fff';x.strokeStyle='#236a8b';x.lineWidth=5;x.strokeText('HEIM',e[0],Math.min(630,e[1]+112));x.fillText('HEIM',e[0],Math.min(630,e[1]+112));if(pi.complete)x.drawImage(pi,pig.x,pig.y,pig.w,pig.h)}function d2(px,py,a,b){let vx=b[0]-a[0],vy=b[1]-a[1],wx=px-a[0],wy=py-a[1],c=vx*wx+vy*wy;if(c<=0)return Math.hypot(px-a[0],py-a[1]);let z=vx*vx+vy*vy;if(c>=z)return Math.hypot(px-b[0],py-b[1]);let r=c/z;return Math.hypot(px-a[0]-r*vx,py-a[1]-r*vy)}function ok(px,py){let l=L[n];if(!l[1])return px>55&&px<1145&&py>100&&py<595;let m=1e9,a=l[2];for(let i=0;i<a.length-1;i++)m=Math.min(m,d2(px,py,a[i],a[i+1]));return m<=l[1]/2-43}function pt(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*1200/r.width,y:(e.clientY-r.top)*650/r.height}}c.onpointerdown=e=>{if(busy)return;let q=pt(e);if(q.x<pig.x-12||q.x>pig.x+pig.w+12||q.y<pig.y-12||q.y>pig.y+pig.h+12)return toast('Smelltu á Peppu 🐷');drag=1;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag||busy)return;let q=pt(e),nx=q.x-pig.w/2,ny=q.y-pig.h/2,ox=pig.x+pig.w/2,oy=pig.y+pig.h/2,nx2=nx+pig.w/2,ny2=ny+pig.h/2,z=Math.max(1,Math.ceil(Math.hypot(nx2-ox,ny2-oy)/8));for(let i=1;i<=z;i++){let r=i/z;if(!ok(ox+(nx2-ox)*r,oy+(ny2-oy)*r))return fail('Ó nei! Peppa snerti vegginn 🌿')}pig.x=nx;pig.y=ny;draw();if(goal())win()};c.onpointerup=()=>{if(drag&&!busy){drag=0;goal()?win():fail('Haltu músarhnappnum inni alla leið 🖱️')}};function goal(){let e=L[n][2].at(-1);return Math.hypot(pig.x+pig.w/2-e[0],pig.y+pig.h/2-e[1])<64}function fail(s){busy=1;drag=0;tone(0);toast(s);setTimeout(()=>{resetPig();busy=0},650)}function win(){if(busy)return;busy=1;drag=0;tone(1);if(p[n]<5)p[n]++;save();count.textContent=`⭐ ${p[n]} / 5`;draw();if(p[n]>=5)setTimeout(done,400);else{toast(`Frábært! ${p[n]} af 5 ⭐`);setTimeout(()=>{resetPig();busy=0},900)}}function done(){mi.textContent=n==9?'🏆':'⭐';mt.textContent=n==9?'Þú kláraðir allan leikinn!':`Stig ${n+1} klárað!`;mx.textContent=n==9?'Frábær músastjórn!':`Þú komst með Peppu heim 5 sinnum. Stig ${n+2} er nú opið.`;next.textContent=n==9?'Spila aftur':`Fara í stig ${n+2}`;modal.classList.add('on')}function toast(s){clearTimeout(t);msg.textContent=s;msg.classList.add('on');t=setTimeout(()=>msg.classList.remove('on'),1100)}function sync(){s1.textContent=snd?'🔊 Hljóð':'🔇 Hljóð';s2.textContent=snd?'🔊':'🔇'}function tone(g){if(!snd)return;try{audio||=new AudioContext;let o=audio.createOscillator(),v=audio.createGain();o.connect(v);v.connect(audio.destination);o.frequency.value=g?660:210;v.gain.value=.08;o.start();o.stop(audio.currentTime+.18)}catch(e){}}s1.onclick=s2.onclick=()=>{snd=!snd;localStorage.setItem(S,snd?'on':'off');sync()};back.onclick=()=>{game.classList.remove('on');home.classList.add('on');render()};reset.onclick=()=>{if(confirm('Viltu endurstilla allan árangur?')){p=Array(10).fill(0);save();render()}};full.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();next.onclick=()=>{modal.classList.remove('on');start(n==9?9:n+1)};menu.onclick=()=>{modal.classList.remove('on');back.click()};pi.onload=hi.onload=draw;render();sync()})()</script></body></html>
